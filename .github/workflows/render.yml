name: Render plates

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "assets/fonts/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG plates
        env:
          # A classic PAT with read:user (and repo, for private counts) in
          # PROFILE_TOKEN makes the numbers match the profile page. Without it
          # the default token only sees public activity.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json
          if git diff --cached --quiet; then
            echo "Plates unchanged."
          else
            git commit -m "Re-issue plates $(date -u +%Y-%m-%d)"
            git push
          fi
