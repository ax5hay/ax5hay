<style>@font-face{font-family:"ax-serif";font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"ax-serif-i";font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"ax-mono-m";font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}text{white-space:pre}.serif{font-family:'ax-serif','Instrument Serif',Georgia,serif}.serif-i{font-family:'ax-serif-i','Instrument Serif',Georgia,serif;font-style:italic}.mono{font-family:'ax-mono','IBM Plex Mono',ui-monospace,Menlo,monospace}.mono-m{font-family:'ax-mono-m','IBM Plex Mono',ui-monospace,Menlo,monospace}.sans{font-family:'ax-sans','IBM Plex Sans',system-ui,sans-serif}.dr{stroke-dasharray:1 1;animation:dr 1.6s cubic-bezier(.65,0,.25,1) both}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.fi{animation:fi 1s ease-out both}@keyframes fi{from{opacity:0}}.up{animation:up 1s cubic-bezier(.2,.7,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(16px)}}.lt{animation:lt 1s cubic-bezier(.2,.7,.2,1) both}@keyframes lt{from{opacity:0;transform:translateX(-14px)}}.fb{transform-box:fill-box}.wipe{animation:wipe .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 0}@keyframes wipe{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
